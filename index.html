<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Drone Checklist">
<title>Drone Preflight Checklist</title>
<link rel="manifest" href="manifest.json">
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500&display=swap');
  /* Offline fallback stacks if Google Fonts unavailable */
  :root {
    --bg: #1a1008;
    --surface: #221508;
    --surface2: #2e1e0e;
    --border: #3d2a10;
    --orange: #e8650a;
    --orange-light: #f5824a;
    --orange-dim: #7a3508;
    --white: #ffffff;
    --text: #f5e8d8;
    --muted: #a07850;
    --green: #4ddd88;
    --red: #ff5555;
    --field-bg: #2a1a08;
    --field-border: #5a3a18;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); font-family: 'Barlow', sans-serif; min-height: 100vh; padding-bottom: env(safe-area-inset-bottom); }

  /* ── HEADER ── */
  header {
    background: var(--surface);
    border-bottom: 2px solid var(--orange);
    padding: 0 0 12px;
    padding-top: env(safe-area-inset-top);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-brand {
    display: flex;
    align-items: stretch;
    gap: 0;
    background: var(--orange);
  }

  .header-logo {
    width: 58px;
    flex-shrink: 0;
    background: var(--orange);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px;
  }
  .header-logo img { width: 46px; height: auto; display: block; border-radius: 2px; }

  .header-title-block {
    flex: 1;
    background: var(--orange);
    padding: 8px 12px 8px 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .header-eyebrow {
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px;
    color: rgba(255,255,255,0.75);
    letter-spacing: 2.5px;
    text-transform: uppercase;
  }

  h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 20px;
    font-weight: 800;
    color: #fff;
    line-height: 1.05;
    letter-spacing: 0.5px;
  }

  .header-sub {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    font-weight: 600;
    color: rgba(255,255,255,0.8);
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .header-reset {
    background: rgba(0,0,0,0.25);
    border: none;
    border-left: 1px solid rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.85);
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    padding: 0 14px;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    transition: background 0.2s;
  }
  .header-reset:active { background: rgba(0,0,0,0.45); }

  /* ── MISSION FIELDS ── */
  .mission-fields-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 12px 5px;
    background: var(--surface);
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .mission-fields-header:active { background: var(--surface2); }

  .mission-fields-title {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: var(--orange-light);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .mission-fields-chevron {
    font-size: 12px;
    color: var(--muted);
    transition: transform 0.2s;
    flex-shrink: 0;
  }
  .mission-fields-chevron.collapsed { transform: rotate(-90deg); }

  .mission-fields {
    padding: 0 12px 8px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    overflow: hidden;
    transition: max-height 0.3s ease, padding 0.3s ease, opacity 0.3s ease;
    max-height: 600px;
    opacity: 1;
  }
  .mission-fields.collapsed {
    max-height: 0;
    padding-top: 0;
    padding-bottom: 0;
    opacity: 0;
  }

  .fields-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
  }

  .field-full { grid-column: 1 / -1; }

  .field-group {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .field-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px;
    color: var(--orange-light);
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .field-input {
    background: var(--field-bg);
    border: 1px solid var(--field-border);
    border-radius: 5px;
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: 13px;
    padding: 7px 9px;
    width: 100%;
    outline: none;
    transition: border-color 0.15s;
    -webkit-appearance: none;
  }
  .field-input:focus { border-color: var(--orange); }
  .field-input::placeholder { color: var(--muted); opacity: 0.6; }

  textarea.field-input {
    resize: none;
    height: 58px;
    line-height: 1.4;
    font-size: 12px;
  }

  .item-inline-input {
    display: block;
    margin-top: 6px;
    background: var(--field-bg);
    border: 1px solid var(--field-border);
    border-radius: 5px;
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: 14px;
    padding: 6px 9px;
    width: 100%;
    outline: none;
    -webkit-appearance: none;
    transition: border-color 0.15s;
  }
  .item-inline-input:focus { border-color: var(--orange); }
  .item-inline-input::placeholder { color: var(--muted); opacity: 0.55; font-size: 13px; }

  /* ── PROGRESS ── */
  .progress-wrap {
    padding: 8px 12px 6px;
    background: var(--surface);
  }
  .progress-bar-row { display: flex; align-items: center; gap: 10px; }
  .progress-track { flex: 1; height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--orange), var(--green)); border-radius: 3px; transition: width 0.35s ease; width: 0%; }
  .progress-label { font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--orange-light); white-space: nowrap; min-width: 52px; text-align: right; }

  /* ── SECTIONS ── */
  main { padding: 8px 0 40px; }

  .section { margin-bottom: 5px; }

  .section-header {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    cursor: pointer; user-select: none; transition: background 0.15s;
  }
  .section-header:active { background: var(--surface2); }

  .section-num {
    font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 700;
    width: 22px; height: 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }

  .section-title {
    font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase; flex: 1;
  }

  .section-count { font-family: 'Share Tech Mono', monospace; font-size: 10px; color: var(--muted); flex-shrink: 0; }

  .select-all-btn {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    font-family: 'Share Tech Mono', monospace; font-size: 10px;
    padding: 4px 8px; border-radius: 4px; cursor: pointer; white-space: nowrap;
    transition: all 0.15s; flex-shrink: 0;
  }
  .select-all-btn:active { background: var(--surface2); }
  .select-all-btn.all-done { color: var(--green); border-color: var(--green); }

  .section-chevron { font-size: 12px; color: var(--muted); transition: transform 0.2s; flex-shrink: 0; }
  .section.collapsed .section-chevron { transform: rotate(-90deg); }
  .section-items { overflow: hidden; }
  .section.collapsed .section-items { display: none; }

  /* ── ITEMS ── */
  .item {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 12px 14px; border-bottom: 1px solid var(--border);
    background: var(--bg); cursor: pointer; transition: background 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .item:active { background: var(--surface2); }
  .item.checked { background: #0f1a0a; }

  .item-checkbox {
    width: 24px; height: 24px; border-radius: 6px; border: 2px solid var(--border);
    flex-shrink: 0; margin-top: 1px;
    display: flex; align-items: center; justify-content: center; transition: all 0.2s;
  }
  .item.checked .item-checkbox { background: var(--green); border-color: var(--green); }
  .item-checkbox svg { display: none; width: 14px; height: 14px; }
  .item.checked .item-checkbox svg { display: block; }

  .item-text { flex: 1; font-size: 14px; line-height: 1.45; color: var(--text); transition: color 0.2s; }
  .item.checked .item-text { color: var(--muted); text-decoration: line-through; text-decoration-color: #2a4020; }

  .item-note {
    margin-top: 5px; font-size: 12px; font-style: italic; color: var(--orange-light);
    background: rgba(232,101,10,0.08); border-left: 2px solid var(--orange);
    padding: 4px 8px; border-radius: 0 4px 4px 0; line-height: 1.4;
  }

  /* ── LAUNCH BANNER ── */
  @keyframes launchPulse {
    0%   { box-shadow: 0 0 0px 0px rgba(77,221,136,0); }
    25%  { box-shadow: 0 0 16px 6px rgba(77,221,136,0.8); }
    50%  { box-shadow: 0 0 0px 0px rgba(77,221,136,0); }
    75%  { box-shadow: 0 0 16px 6px rgba(77,221,136,0.8); }
    100% { box-shadow: 0 0 8px 3px rgba(77,221,136,0.35); }
  }

  /* ── LAUNCH STATUS BAR (pinned in header) ── */
  .launch-status {
    margin: 6px 12px 2px;
    border-radius: 7px;
    padding: 8px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.4s, border-color 0.4s;
  }
  .launch-status.not-ready {
    background: rgba(180,30,30,0.18);
    border: 1.5px solid var(--red);
  }
  .launch-status.ready {
    background: rgba(77,221,136,0.12);
    border: 1.5px solid var(--green);
    animation: launchPulse 1.6s ease-in-out forwards;
  }
  .launch-status-dot {
    width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
    transition: background 0.4s;
  }
  .not-ready .launch-status-dot { background: var(--red); }
  .ready .launch-status-dot { background: var(--green); }
  .launch-status-text {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px; font-weight: 800; letter-spacing: 2px;
    text-transform: uppercase;
    transition: color 0.4s;
  }
  .not-ready .launch-status-text { color: var(--red); }
  .ready .launch-status-text { color: var(--green); }
  .launch-status-sub {
    margin-left: auto;
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px; color: var(--muted); letter-spacing: 1px;
    white-space: nowrap;
  }

  /* ── DRONE IMAGE ── */
  .drone-image-section { margin: 20px 12px 12px; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
  .drone-image-section img { width: 100%; display: block; }
  .drone-image-caption {
    background: var(--surface); padding: 7px 12px;
    font-family: 'Share Tech Mono', monospace; font-size: 10px;
    color: var(--muted); letter-spacing: 2px; text-transform: uppercase; text-align: center;
  }
</style>
</head>

<script>
const sections = [
  { num:1, title:"Mission Planning", color:"#f5824a", items:[
    {text:"Confirm incident assignment and objectives (search area)"},
    {text:"Assign roles (PIC, Visual observers etc.)"},
    {text:"Confirm communications plan (primary/secondary)"},
    {text:"Select search tactic (grid, manual flight)"},
    {text:"Check airspace (Sectional chart, AirAware app, NOTAMs on SkyVector)"},
    {text:"Confirm waivers or permissions needed (Wilderness area, airport)"},
    {text:"Review weather (Winds, Cloud cover)"},
    {text:"Identify terrain and signal hazards (Wires, Trees, Hills)"},
    {text:"All required gear and spares inventory (Drone, Batteries, Controller, Chargers)"},
    {text:"Will there be internet or Starlink? If not, download everything needed", inlineInput:true},
  ]},
  { num:2, title:"Site Setup", color:"#e8650a", items:[
    {text:"Select a safe launch and landing zone"},
    {text:"Identify emergency landing zones"},
    {text:"Identify no-fly hazards near the operating area"},
    {text:"Position visual observer(s) as required"},
    {text:"Inspect aircraft arms and props, hinges for damage or play"},
    {text:"Remove gimbal protector before power-on"},
    {text:"Verify microSD card installed with sufficient free space !!!!"},
    {text:"Clean and inspect vision and obstacle avoidance sensors"},
  ]},
  { num:3, title:"Controller &amp; App", color:"#f5a04a", items:[
    {text:"Verify controller battery level sufficient for mission"},
    {text:"Position controller antennas correctly"},
    {text:"Power on controller and aircraft; confirm link established"},
    {text:"Check for system alerts or warnings and resolve any critical issues"},
    {text:"Run DJI Pilot 2 in-app preflight checklist and confirm all items green"},
    {text:"Set all camera settings as needed"},
    {text:"Confirm home point is set accurately"},
    {text:"Set return-to-home altitude for terrain and deconfliction"},
    {text:"Confirm failsafe behavior (RTH or hover) matches mission plan"},
    {text:"Verify altitude"},
    {text:"Verify obstacle avoidance settings appropriate for terrain"},
    {text:"Confirm recording settings for visual and thermal cameras"},
  ]},
  { num:4, title:"SARtopo / Eagle Eyes", color:"#e8650a", items:[
    {text:"Load map into CalTopo on remote app"},
    {text:"Copy link of map or use QR code of map to connect it to Eagle Eyes app", note:"Tip: copy the link directly from CalTopo to Eagle Eyes Pilot"},
    {text:"To use QR code: open map info on phone &#8594; Share &#8594; Select QR code"},
    {text:"On remote in Eagle Eyes Pilot: tap &#9776; top right &#8594; Link CalTopo &#8594; Use QR code &#8594; Scan QR code with drone camera (may need a moment to focus) &#8594; Map should be live and tracking"},
    {text:"Verify on CalTopo map on other device that drone is live"},
  ]},
  { num:5, title:"Mission", color:"#f5824a", items:[
    {text:"Perform initial hover check for stability and link quality"},
    {text:"Verify gimbal and thermal imagery stable"},
    {text:"Confirm return-to-home behavior appears correct"},
    {text:"Fly mission as planned"},
    {text:"Swap batteries as needed"},
  ]},
];

// ── STATE ──
let state = {};
try { state = JSON.parse(sessionStorage.getItem('droneChecklist') || '{}'); } catch(e) {}
function saveState() { try { sessionStorage.setItem('droneChecklist', JSON.stringify(state)); } catch(e) {} }
function getKey(si,ii) { return si+'-'+ii; }
function isSectionAllDone(si) { return sections[si].items.every((_,ii) => state[getKey(si,ii)]); }

// Persist field values
const fieldIds = ['f-mission','f-rpic','f-location','f-vo','f-roles','f-comms','f-notes'];
function saveFields() {
  const vals = {};
  fieldIds.forEach(id => { const el=document.getElementById(id); if(el) vals[id]=el.value; });
  try { sessionStorage.setItem('droneFields', JSON.stringify(vals)); } catch(e) {}
}
function loadFields() {
  try {
    const vals = JSON.parse(sessionStorage.getItem('droneFields') || '{}');
    fieldIds.forEach(id => { const el=document.getElementById(id); if(el && vals[id]) el.value=vals[id]; });
  } catch(e) {}
}
fieldIds.forEach(id => {
  const el = document.getElementById(id);
  if(el) el.addEventListener('input', saveFields);
});

// ── PROGRESS ──
function updateProgress() {
  let total=0, done=0;
  sections.forEach((sec,si) => sec.items.forEach((_,ii) => { total++; if(state[getKey(si,ii)]) done++; }));
  document.getElementById('progressFill').style.width = (total ? done/total*100 : 0)+'%';
  document.getElementById('progressLabel').textContent = done+' / '+total;
  sections.forEach((sec,si) => {
    let sdone = sec.items.filter((_,ii) => state[getKey(si,ii)]).length;
    const ce = document.getElementById('sec-count-'+si);
    const be = document.getElementById('sel-all-'+si);
    if(ce){ ce.textContent = sdone+'/'+sec.items.length; ce.style.color = sdone===sec.items.length ? '#4ddd88' : ''; }
    if(be){ const all=sdone===sec.items.length; be.textContent=all?'UNCHECK ALL':'CHECK ALL'; be.classList.toggle('all-done',all); }
  });
  const prelaunchDone = [0,1,2,3].every(si => isSectionAllDone(si));
  const statusEl = document.getElementById('launchStatus');
  const statusText = document.getElementById('launchStatusText');
  const statusSub = document.getElementById('launchStatusSub');
  if (prelaunchDone) {
    statusEl.classList.remove('not-ready');
    // Remove and re-add 'ready' to restart the pulse animation every time
    statusEl.classList.remove('ready');
    void statusEl.offsetWidth;
    statusEl.classList.add('ready');
    statusText.textContent = 'GO FOR LAUNCH';
    statusSub.textContent = 'SECTIONS 1–4 COMPLETE';
  } else {
    statusEl.classList.remove('ready');
    statusEl.classList.add('not-ready');
    statusText.textContent = 'NOT READY TO LAUNCH';
    // Count how many of sections 1-4 are done
    const done14 = [0,1,2,3].filter(si => isSectionAllDone(si)).length;
    statusSub.textContent = done14 + ' / 4 SECTIONS COMPLETE';
  }
}

function toggleItem(si,ii) {
  const k=getKey(si,ii); state[k]=!state[k]; saveState();
  document.getElementById('item-'+si+'-'+ii).classList.toggle('checked',state[k]);
  updateProgress();
}

function toggleSelectAll(si,e) {
  e.stopPropagation();
  const all=isSectionAllDone(si);
  sections[si].items.forEach((_,ii) => { state[getKey(si,ii)]=!all; const el=document.getElementById('item-'+si+'-'+ii); if(el) el.classList.toggle('checked',!all); });
  saveState(); updateProgress();
}

function toggleSection(si) { document.getElementById('section-'+si).classList.toggle('collapsed'); }

function toggleMissionFields() {
  const fields = document.getElementById('missionFields');
  const chevron = document.getElementById('missionChevron');
  const collapsed = fields.classList.toggle('collapsed');
  chevron.classList.toggle('collapsed', collapsed);
  try { sessionStorage.setItem('missionFieldsCollapsed', collapsed ? '1' : '0'); } catch(e) {}
}

function resetAll() {
  if(!confirm('Reset all checklist items and mission fields?')) return;
  state={}; saveState();
  document.querySelectorAll('.item').forEach(el => el.classList.remove('checked'));
  fieldIds.forEach(id => { const el=document.getElementById(id); if(el) el.value=''; });
  try { sessionStorage.removeItem('droneFields'); } catch(e) {}
  // Clear inline inputs
  document.querySelectorAll('.item-inline-input').forEach(el => el.value='');
  try { sessionStorage.removeItem('droneInlineInputs'); } catch(e) {}
  updateProgress();
}

// ── BUILD DOM ──
const container = document.getElementById('checklist');
sections.forEach((sec,si) => {
  const secEl = document.createElement('div');
  secEl.className='section'; secEl.id='section-'+si;

  const hdr = document.createElement('div');
  hdr.className='section-header';
  hdr.onclick = () => toggleSection(si);
  hdr.innerHTML =
    '<div class="section-num" style="background:'+sec.color+'28;color:'+sec.color+'">'+sec.num+'</div>'+
    '<div class="section-title" style="color:'+sec.color+'">'+sec.title+'</div>'+
    '<div class="section-count" id="sec-count-'+si+'">0/'+sec.items.length+'</div>'+
    '<button class="select-all-btn" id="sel-all-'+si+'">CHECK ALL</button>'+
    '<div class="section-chevron">&#9662;</div>';

  const itemsEl = document.createElement('div');
  itemsEl.className='section-items';

  sec.items.forEach((item,ii) => {
    const checked = !!state[getKey(si,ii)];
    const div = document.createElement('div');
    div.className='item'+(checked?' checked':''); div.id='item-'+si+'-'+ii;
    div.onclick = () => toggleItem(si,ii);

    let extraHTML = '';
    if (item.inlineInput) {
      const inputId = 'inline-'+si+'-'+ii;
      const savedVal = (function(){ try { return JSON.parse(sessionStorage.getItem('droneInlineInputs')||'{}')[inputId]||''; } catch(e){return '';} })();
      extraHTML = '<input class="item-inline-input" id="'+inputId+'" type="text" placeholder="e.g. Starlink available / no internet — downloaded maps" autocomplete="off" value="'+savedVal.replace(/"/g,'&quot;')+'">';
    }

    div.innerHTML =
      '<div class="item-checkbox"><svg viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 7L5.5 10.5L12 3.5" stroke="#1a1008" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>'+
      '<div class="item-text">'+item.text+(item.note?'<div class="item-note">&#128161; '+item.note+'</div>':'')+extraHTML+'</div>';
    itemsEl.appendChild(div);

    if (item.inlineInput) {
      const inputEl = document.getElementById('inline-'+si+'-'+ii);
      if (inputEl) {
        // Stop tap on input from toggling the checkbox
        inputEl.addEventListener('click', e => e.stopPropagation());
        inputEl.addEventListener('touchend', e => e.stopPropagation());
        // Save value on change
        inputEl.addEventListener('input', function() {
          try {
            const store = JSON.parse(sessionStorage.getItem('droneInlineInputs')||'{}');
            store['inline-'+si+'-'+ii] = this.value;
            sessionStorage.setItem('droneInlineInputs', JSON.stringify(store));
          } catch(e) {}
        });
      }
    }
  });

  secEl.appendChild(hdr); secEl.appendChild(itemsEl); container.appendChild(secEl);
  const btn=document.getElementById('sel-all-'+si);
  if(btn) btn.addEventListener('click', e => toggleSelectAll(si,e));
});

loadFields();
// Restore mission fields collapsed state
try {
  if (sessionStorage.getItem('missionFieldsCollapsed') === '1') {
    document.getElementById('missionFields').classList.add('collapsed');
    document.getElementById('missionChevron').classList.add('collapsed');
  }
} catch(e) {}
updateProgress();
</script>
</body>
</html>
